version: 2
updates:
  # Keeps the commit-pinned actions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
  # Hash-pinned test-only wheels for the research suites (scripts/ci/requirements-pytest.txt).
  - package-ecosystem: pip
    directory: /scripts/ci
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      pytest:
        patterns: ["*"]
